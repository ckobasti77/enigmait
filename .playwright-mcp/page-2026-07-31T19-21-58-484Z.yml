    - generic [ref=f5e44]:
      - generic [ref=f5e45]:
        - generic [ref=f5e46]: Uslovi korišćenja
        - heading "Pravila saradnje za rad sa Enigma Digital timom" [level=1] [ref=f5e47]
        - paragraph [ref=f5e48]: Ovi Uslovi opisuju kako sarađujemo sa product timovima, kako se regulišu naknade i koja prava i obaveze svaka strana zadržava. Važe za svaki angažman osim ako ih ne zameni potpisani ugovor.
        - generic [ref=f5e49]: "Poslednje ažuriranje: 7. oktobar 2025."
      - generic [ref=f5e50]:
        - article [ref=f5e51]:
          - generic [ref=f5e52]:
            - heading "Podobnost" [level=2] [ref=f5e53]
            - paragraph [ref=f5e54]: Morate imati najmanje 18 godina i biti ovlašćeni da zaključite obavezujući ugovor za korišćenje naših Usluga. Nastavkom saradnje sa Enigma Digital potvrđujete da ispunjavate ove uslove.
        - article [ref=f5e55]:
          - generic [ref=f5e56]:
            - heading "Opseg usluga" [level=2] [ref=f5e57]
            - paragraph [ref=f5e58]: Isporučujemo strategiju, dizajn, inženjering i povezane konsultantske angažmane. Konkretne isporuke, rokovi i naknade definišu se u odgovarajućem statement of work dokumentu ili ugovoru o uslugama. Ako postoji konflikt, važi projektni ugovor.
        - article [ref=f5e59]:
          - generic [ref=f5e60]:
            - heading "Naknade i plaćanje" [level=2] [ref=f5e61]
            - paragraph [ref=f5e62]: Fakture prate raspored naveden u projektnom ugovoru i plaćaju se u dogovorenim rokovima. Kašnjenje u plaćanju može nositi mesečnu finansijsku naknadu od 1,5% ili maksimalno dozvoljenu zakonom, i može dovesti do obustave Usluga.
        - article [ref=f5e63]:
          - generic [ref=f5e64]:
            - heading "Obaveze klijenta" [level=2] [ref=f5e65]
            - paragraph [ref=f5e66]: Obezbedite pravovremene povratne informacije, odobrenja, materijale i stručnost iz domena. Osigurajte da materijali koje dostavite ne krše prava trećih strana. Kašnjenja u pregledima ili odobrenjima mogu uticati na dogovorene rokove.
        - article [ref=f5e67]:
          - generic [ref=f5e68]:
            - heading "Intelektualna svojina" [level=2] [ref=f5e69]
            - paragraph [ref=f5e70]: Zadržavate vlasništvo nad materijalima koje dostavite. Nakon potpune uplate posedujete konkretne isporuke kreirane za vas, dok Enigma Digital zadržava prava na prethodno postojeće alate, framework-e i know-how. Nepoverljiv rad može biti prikazan u našem portfoliju osim ako nije drugačije dogovoreno.
        - article [ref=f5e71]:
          - generic [ref=f5e72]:
            - heading "Poverljivost i podaci" [level=2] [ref=f5e73]
            - paragraph [ref=f5e74]: Svaka strana se obavezuje da štiti poverljive informacije druge strane i koristi ih isključivo za izvršenje Usluga. Ako su uključeni lični podaci, obrađuju se prema našoj Politici privatnosti i važećem ugovoru.
        - article [ref=f5e75]:
          - generic [ref=f5e76]:
            - heading "Odricanja i odgovornost" [level=2] [ref=f5e77]
            - paragraph [ref=f5e78]: Usluge se pružaju u viđenom stanju. Odričemo se svih podrazumevanih garancija u najvećoj meri dozvoljenoj zakonom i ne garantujemo konkretne ishode. Naša ukupna odgovornost neće premašiti naknade plaćene za angažman iz kog proističe zahtev.
        - article [ref=f5e79]:
          - generic [ref=f5e80]:
            - heading "Raskid" [level=2] [ref=f5e81]
            - paragraph [ref=f5e82]: Svaka strana može raskinuti ugovor zbog bitnog kršenja uz pisano obaveštenje od 14 dana ako kršenje nije otklonjeno. Ostajete odgovorni za naknade nastale do datuma raskida. Odredbe o poverljivosti, intelektualnoj svojini, naknadama i odgovornosti ostaju na snazi nakon raskida.
        - article [ref=f5e83]:
          - generic [ref=f5e84]:
            - heading "Merodavno pravo" [level=2] [ref=f5e85]
            - paragraph [ref=f5e86]: Ovi Uslovi i svi sporovi koji proisteknu iz Usluga regulisani su zakonima Engleske i Velsa. Sudovi Engleske i Velsa imaju isključivu nadležnost nakon što obe strane pokušaju rešavanje u dobroj veri.
      - paragraph [ref=f5e88]:
        - text: Imate pitanja o ovim Uslovima? Pišite nam na
        - link "hello@enigma.digital" [ref=f5e89] [cursor=pointer]:
          - /url: mailto:hello@enigma.digital
        - text: ili pozovite
